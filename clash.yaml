    proxies:
      - 自动
      - 美国-圣何塞 RAKsmart-SV 10TB
      - 美国-西雅图 Cloady-xray 15GB
      - 美国-迈阿密 URnetwork-AT&T
      - 美国-堪萨斯城 URnetwork-GoogleFiber
