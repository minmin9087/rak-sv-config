port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  nameserver:
    - 223.5.5.5
    - 8.8.8.8
proxies:
  - name: RAKsmart-SV
    type: vless
    server: rak.zhoumeiwen.com
    port: 443
    uuid: 46785944-965c-4fd5-b84b-cee9aa56fc18
    alterId: 0
    cipher: auto
    tls: true
    servername: rak.zhoumeiwen.com
    network: ws
    ws-opts:
      path: /vless
      headers:
        Host: rak.zhoumeiwen.com
    fingerprint: chrome
    udp: true
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - RAKsmart-SV
      - DIRECT
rules:
  - MATCH,PROXY
