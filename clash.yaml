port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  nameserver:
    - 223.5.5.5
    - 8.8.8.8
proxies:
  - name: RAKsmart-SV
    type: vless
    server: 104.233.202.6
    port: 443
    uuid: 2f941039-0dec-4f99-b036-77968be1834a
    alterId: 0
    cipher: auto
    tls: true
    skip-cert-verify: true
    servername: www.microsoft.com
    network: ws
    ws-opts:
      path: /vless
      headers:
        Host: www.microsoft.com
    fingerprint: chrome
    udp: true
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - RAKsmart-SV
      - DIRECT
rules:
  - MATCH,PROXY
