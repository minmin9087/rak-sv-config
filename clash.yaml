port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
  - name: RAKsmart-SV
    type: vless
    server: rak.zhoumeiwen.com
    port: 443
    uuid: 46785944-965c-4fd5-b84b-cee9aa56fc18
    alterId: 0
    cipher: auto
    tls: true
    servername: rak.zhoumeiwen.com
    network: ws
    ws-opts:
      path: /vless
      headers:
        Host: rak.zhoumeiwen.com
    udp: true
  - name: Cloady-xray
    type: vless
    server: xray-t7ir3xbn-workspace-dw3xvd.cloady.io
    port: 443
    uuid: 6670bd18-1a4c-4445-b772-de0b55ef9d45
    alterId: 0
    cipher: auto
    tls: true
    servername: xray-t7ir3xbn-workspace-dw3xvd.cloady.io
    network: ws
    ws-opts:
      path: /vless
      headers:
        Host: xray-t7ir3xbn-workspace-dw3xvd.cloady.io
    udp: true
proxy-groups:
  - name: 手动选择
    type: select
    proxies:
      - RAKsmart-SV
      - Cloady-xray
      - DIRECT
      - 自动选择
      - 故障转移
  - name: 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - RAKsmart-SV
      - Cloady-xray
  - name: 故障转移
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - RAKsmart-SV
      - Cloady-xray
  - name: AI服务
    type: select
    proxies:
      - RAKsmart-SV
      - Cloady-xray
      - DIRECT
  - name: 流媒体
    type: select
    proxies:
      - RAKsmart-SV
      - Cloady-xray
      - DIRECT
  - name: 国内服务
    type: select
    proxies:
      - DIRECT
      - RAKsmart-SV
      - Cloady-xray
      - 自动选择
  - name: GLOBAL
    type: select
    proxies:
      - RAKsmart-SV
      - Cloady-xray
      - 自动选择
      - DIRECT
